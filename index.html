<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var stored = localStorage.getItem('color-scheme');
        if (stored === 'light' || stored === 'dark') {
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', stored);
        }
      } catch (error) {
        /* Storage can be blocked. The page still follows the system scheme. */
      }
    </script>
    <title>Meridian — Fleet operations</title>
    <meta
      name="description"
      content="Portfolio demo of a real-time vehicle and drone fleet monitor. Telemetry is simulated."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
